<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K8s Microservices Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        button {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: #fff;
            border: none;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .response {
            margin-top: 2rem;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 1.5rem;
            text-align: left;
            display: none;
        }

        .response.visible {
            display: block;
        }

        .response pre {
            color: #38bdf8;
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .response .label {
            color: #94a3b8;
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .error {
            color: #f87171;
        }

        .status {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kubernetes Microservices</h1>
        <p class="subtitle">Frontend served by Nginx &mdash; Backend powered by Flask</p>

        <button id="callBtn" onclick="callBackend()">Call Backend API</button>

        <div id="response" class="response">
            <div class="label">Backend Response</div>
            <pre id="output"></pre>
        </div>

        <div id="status" class="status"></div>
    </div>

    <script>
        let callCount = 0;

        async function callBackend() {
            const btn = document.getElementById("callBtn");
            const responseDiv = document.getElementById("response");
            const output = document.getElementById("output");
            const status = document.getElementById("status");

            btn.disabled = true;
            btn.textContent = "Calling...";

            try {
                const res = await fetch("/api/hello");
                const data = await res.json();
                callCount++;

                output.textContent = JSON.stringify(data, null, 2);
                output.classList.remove("error");
                responseDiv.classList.add("visible");
                status.textContent = `Call #${callCount} — Pod: ${data.pod}`;
            } catch (err) {
                output.textContent = `Error: ${err.message}`;
                output.classList.add("error");
                responseDiv.classList.add("visible");
                status.textContent = "Backend unreachable";
            } finally {
                btn.disabled = false;
                btn.textContent = "Call Backend API";
            }
        }
    </script>
</body>
</html>
